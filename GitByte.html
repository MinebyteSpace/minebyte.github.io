<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GITBYTE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --bg: #0d1117;   /* dark GitHub-style background */
      --fg: #c9d1d9;   /* light text */
      --accent: #58a6ff; /* blue accent */
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      padding: 2rem 1rem;
      text-align: center;
    }
    h1 {
      font-size: 3rem;
      color: var(--accent);
      letter-spacing: 1px;
    }
    main {
      flex: 1;
      max-width: 800px;
      margin: 0 auto;
      padding: 1rem;
      line-height: 1.6;
    }
    a {
      color: var(--accent);
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    footer {
      padding: 1rem;
      text-align: center;
      font-size: 0.875rem;
      color: #8b949e;
    }
  </style>
</head>
<body>
  <header>
    <h1>GITBYTE</h1>
    <p>A lightweight hub for your Git experiments.</p>
  </header>

  <main>
    <h2>About</h2>
    <p>
      This page lives on <strong>GitHub Pages</strong>.  
      Replace this text with whatever you want visitors to know about GITBYTE.
    </p>

    <h2>Links</h2>
    <ul>
      <li><a href="https://github.com/YOUR_USERNAME">GitHub Profile</a></li>
      <li><a href="https://github.com/YOUR_USERNAME/GITBYTE">Project Repo</a></li>
    </ul>
  </main>

  <footer>
    © 2025 GITBYTE
  </footer>
</body>
</html>
